[project]
name = "vriddhi-inbound-agent"
version = "0.1.0"
description = "Inbound WhatsApp voice agent: Prism picks the use case, specialists handle it"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[cerebras,deepgram,sarvam,silero]~=1.5",
    "livekit-plugins-noise-cancellation",
    "aiohttp",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]
